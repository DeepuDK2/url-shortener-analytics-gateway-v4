version: '3.8'
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: DeepuDK2
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: url_shortener_analytics_gateway
    ports:
      - "5432:5432"
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://DeepuDK2:secret_password@postgres:5432/url_shortener_analytics_gateway
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
